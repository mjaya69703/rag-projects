version: "3.8"

services:
  knowledge-base:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex_knowledge_base
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Variabel yang diteruskan ke container = persis yang dibaca code
    # (app/config.py & app/llm_client.py). Nilai diambil dari file .env
    # di direktori yang sama dengan docker-compose.yml.
    environment:
      # LLM (OpenAI-compatible)
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL}
      # Penyimpanan (di-mount ke volume di bawah)
      - PERSIST_DIR=/app/data/chroma_db
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/data/chat.db
      # Keamanan & privasi
      - REDACTION_ENABLED=${REDACTION_ENABLED:-true}
      - RETAIN_CHAT_DAYS=${RETAIN_CHAT_DAYS:-30}
      - CACHE_MAX_DAYS=${CACHE_MAX_DAYS:-30}
      - API_TOKEN=${API_TOKEN:-}
      - RATE_LIMIT_QPM=${RATE_LIMIT_QPM:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Kualitas retrieval: reranker cross-encoder (0 = matikan)
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      # Integrasi eksternal (opsional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
