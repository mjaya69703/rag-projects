[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-knowledge-base"
version = "3.0.0"
description = "Production-grade Personal AI Knowledge Base & RAG System with Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Knowledge Base Team" }]
keywords = ["rag", "llm", "knowledge-base", "chromadb", "fastapi", "react", "spaced-repetition"]

[project.scripts]
cortex = "cortex:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
