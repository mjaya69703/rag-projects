name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Model embedding MiniLM di-cache supaya tidak download tiap run
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('app/vector_store.py') }}

      # Torch CPU-only dulu supaya pip tidak menarik build CUDA yang besar
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ruff sudah di-pin di requirements.txt (section Dev) — langsung pakai
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -q
