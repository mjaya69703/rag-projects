name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (Frontend)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend SPA
        run: |
          cd frontend
          bun install
          bun run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('app/Repositories/VectorRepository.py', 'app/reranker.py') }}

      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Run Migrations & Seeders
        run: python cortex migrate:fresh --seed

      - name: Run Automated Pytest Suite
        run: python cortex test
